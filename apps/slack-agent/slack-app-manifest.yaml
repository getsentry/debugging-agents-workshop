display_information:
  name: Lighthouse Analytics
features:
  bot_user:
    display_name: lighthouse-analytics
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: "Answers product analytics questions from the team's metrics warehouse."
    suggested_prompts:
      - title: "Signups last week"
        message: "How did signups do last week compared with the week before?"
      - title: "Checkout conversion"
        message: "What is checkout conversion by device over the last 30 days?"
      - title: "Top movers"
        message: "What changed the most in page views by path this month?"
      - title: "Error rate by release"
        message: "Compare error rate across the last two releases."
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - agent_session_stopped
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
