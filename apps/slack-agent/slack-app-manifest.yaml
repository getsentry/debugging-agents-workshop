display_information:
  name: Acme Shopping Assistant
features:
  bot_user:
    display_name: acme-shop
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: "Answers questions about Acme Store products, orders, and refunds."
    suggested_prompts:
      - title: "Where is my order?"
        message: "Where is my latest order?"
      - title: "Find a hoodie"
        message: "Show me hoodies under $60"
      - title: "Loyalty points"
        message: "How many loyalty points do I have?"
      - title: "Refund an order"
        message: "Can I get a refund for order 1029?"
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
